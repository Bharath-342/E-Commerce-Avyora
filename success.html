<!doctype html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        AVYORA - Order Confirmed
    </title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="/favicon.svg">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="/src/style.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top border-bottom">

        <div class="container">

            <a href="index.html" class="navbar-brand">
                <img src="/avyora-logo.png" alt="AVYORA" class="brand-logo theme-logo">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <form class="d-flex mx-lg-auto my-3 my-lg-0 universal-search-form" data-product-search-form style="max-width: 500px; width: 100%; position: relative;">
                    <div class="input-group">
                        <input type="search" class="form-control" placeholder="Search products, pages (e.g. cart, account, home)..." aria-label="Search products and pages" autocomplete="off">
                        <button class="btn btn-avyora" type="submit" aria-label="Search">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
                <ul class="navbar-nav ms-lg-4 align-items-lg-center gap-3">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link text-dark">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="cart.html" class="nav-link text-dark">Cart</a>
                    </li>
                    <li class="nav-item">
                        <a href="favorites.html" class="nav-link text-dark">Wishlist</a>
                    </li>
                </ul>
            </div>

        </div>

    </nav>

    <main>

        <section class="success-page-section">
            <div class="container">
                <div class="success-card">
                    <div class="success-icon">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                    <span class="section-kicker">ORDER CONFIRMED</span>
                    <h1>Thanks for shopping with AVYORA.</h1>
                    <p>Your order is on the way and a confirmation email is headed to your inbox.</p>

                    <div class="success-summary">
                        <div>
                            <span>Order ID</span>
                            <strong id="successOrderId">--</strong>
                        </div>
                        <div>
                            <span>Customer</span>
                            <strong id="successCustomer">--</strong>
                        </div>
                        <div>
                            <span>Email</span>
                            <strong id="successEmail">--</strong>
                        </div>
                        <div>
                            <span>Total</span>
                            <strong id="successTotal">₹0</strong>
                        </div>
                    </div>

                    <div class="success-meta" id="successItems">0 items</div>

                    <div class="success-actions">
                        <a href="index.html" class="btn btn-avyora">Continue shopping</a>
                        <a href="cart.html" class="btn btn-outline-avyora">View cart</a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/theme.js"></script>

</body>

</html>
